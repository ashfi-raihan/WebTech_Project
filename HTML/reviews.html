<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge - Leave a Review</title>
    <link rel="stylesheet" href="../CSS/reviews.css">
</head>
<body>
    <header>
        <h1>SkillBridge</h1>
        <nav>
            <a href="transaction-history.html">Back to History</a>
        </nav>
    </header>

    <main class="container">
        <div class="card">
            <h2>Rate Your Experience</h2>
            <form id="review-form">
                <label for="rating">Rating:</label>
                <select name="rating" id="rating" required>
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Good</option>
                    <option value="3">3 - Average</option>
                    <option value="2">2 - Poor</option>
                    <option value="1">1 - Terrible</option>
                </select>
                <textarea name="feedback" placeholder="Write your feedback here..." rows="4" required></textarea>
                <button type="submit">Submit Review</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SkillBridge. All rights reserved.</p>
    </footer>

    <script src="../JavaScript/main.js"></script>
</body>
</html>
