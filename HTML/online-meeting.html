<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge - Virtual Classroom</title>
    <link rel="stylesheet" href="../CSS/online-meeting.css">
</head>
<body>
    <header>
        <h1>SkillBridge</h1>
        <nav>
            <a href="calendar.html">Leave Meeting</a>
        </nav>
    </header>

    <main class="container">
        <div class="card meeting-room">
            <h2>Active Session</h2>
            <div class="video-container" style="background: #000; height: 300px; display: flex; align-items: center; justify-content: center; color: #fff; margin-bottom: 20px;">
                <p>Video Feed Placeholder</p>
            </div>
            <div class="meeting-controls">
                <button id="mute-btn">Mute Audio</button>
                <button id="video-btn">Stop Video</button>
                <button id="share-btn">Share Screen</button>
            </div>
        </div>
    </main>
